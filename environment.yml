# conda env create -f environment.yml   →   conda activate osmdwnl
name: osmdwnl
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - gdal>=3.6
  - geopandas>=0.14
  - pyogrio>=0.7
  - shapely>=2.0
  - pyproj>=3.5
  - pandas>=2.0
  - pydantic>=2.5
  - pyyaml>=6.0
  - requests>=2.31
  - pyosmium>=4.0        # только для PBF backend
  - pytest>=7.4
